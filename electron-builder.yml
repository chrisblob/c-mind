appId: app.cmind.desktop
productName: C-Mind
copyright: Copyright © 2026 Chris

directories:
  output: release
  buildResources: build

afterPack: scripts/after-pack.js

files:
  - electron/**
  - dist/**

asar: true

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64]
    - target: dir
      arch: [arm64]
  identity: null

dmg:
  title: C-Mind ${version}

win:
  icon: build/icon.ico
  artifactName: C-Mind-${version}-win-x64.${ext}
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: C-Mind-${version}-win-x64-setup.${ext}
  shortcutName: C-Mind 心图
