name: Bug 反馈
description: 报告一个可以复现的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 感谢反馈！请尽量提供可复现信息。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 应用内「关于」或安装包文件名（如 0.1.0）
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 系统
      placeholder: macOS 15.2 / Apple M2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 …
        2. 点击 …
        3. 出现 …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果 vs 实际结果
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 截图 / 录屏 / 日志（可选）
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue，没有重复
          required: true
