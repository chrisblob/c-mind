name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm 10 默认不执行依赖的 postinstall，Electron 二进制需要显式重建，否则 electron-builder 找不到 dist
      - run: pnpm rebuild electron esbuild
      - run: ls -la node_modules/electron/dist || true
      - run: pnpm build
      - run: pnpm exec electron-builder --mac --publish never
      - run: ls -la release
      - name: Upload release assets (gh CLI)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "C-Mind ${TAG#v}" --generate-notes
          gh release upload "$TAG" release/*.dmg --clobber
          gh release view "$TAG" --json assets -q '.assets[].name'

  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        shell: bash
      - run: pnpm rebuild electron esbuild
        shell: bash
      - name: Enable Windows long paths
        shell: pwsh
        run: |
          Set-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem -Name LongPathsEnabled -Value 1
          git config --system core.longpaths true
      - name: Build Windows packages
        shell: bash
        run: |
          set -o pipefail
          DEBUG=electron-builder pnpm exec electron-builder --win --x64 2>&1 | tee win-build.log || {
            echo "BUILD FAILED, last lines:"
            tail -n 14 win-build.log | cut -c1-900 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - name: Upload release assets (gh CLI)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "C-Mind ${TAG#v}" --generate-notes
          gh release upload "$TAG" release/C-Mind-*-win-x64-setup.exe release/C-Mind-*-win-x64.zip --clobber
          gh release view "$TAG" --json assets -q '.assets[].name'
