name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm 10 默认不执行依赖的 postinstall，Electron 二进制需要显式重建，否则 electron-builder 找不到 dist
      - run: pnpm rebuild electron esbuild
      - run: ls -la node_modules/electron/dist || true
      - run: pnpm build
      - run: pnpm exec electron-builder --mac --publish never
      - run: ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.dmg
          generate_release_notes: true
