<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="-apple-system, PingFang SC, sans-serif">
  <defs>
    <marker id="arr3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#555"/></marker>
  </defs>
  <rect width="960" height="620" fill="#fafbfc"/>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1f36">最终方案：uuid + path 双保险的脑图互链</text>
  <text x="480" y="64" text-anchor="middle" font-size="13" fill="#6b7280">cmind://open?uuid=…&amp;path=…  —— uuid 主解析，path 兜底可读</text>

  <!-- 三方案对比卡 -->
  <rect x="35" y="95" width="285" height="200" rx="10" fill="#fff" stroke="#d0d7de"/>
  <text x="177" y="125" text-anchor="middle" font-size="15" font-weight="700">A. 纯路径重写（1.0.0）</text>
  <text x="55" y="155" font-size="12" fill="#24292f">✔ 链接肉眼可读，git diff 友好</text>
  <text x="55" y="178" font-size="12" fill="#24292f">✔ 应用内移动可自动重写</text>
  <text x="55" y="206" font-size="12" fill="#cf222e">✘ Finder 里移动文件 = 失效</text>
  <text x="55" y="229" font-size="12" fill="#cf222e">✘ 应用对"外部改动"无感知</text>
  <text x="55" y="252" font-size="12" fill="#cf222e">✘ 每次移动都要全盘扫描</text>

  <rect x="337" y="95" width="285" height="200" rx="10" fill="#fff" stroke="#d0d7de"/>
  <text x="479" y="125" text-anchor="middle" font-size="15" font-weight="700">B. 纯 UUID</text>
  <text x="357" y="155" font-size="12" fill="#24292f">✔ 移动/重命名完全免疫</text>
  <text x="357" y="178" font-size="12" fill="#cf222e">✘ 链接不可读，难排查</text>
  <text x="357" y="206" font-size="12" fill="#cf222e">✘ 复制文件 → 两个文件同一身份</text>
  <text x="357" y="229" font-size="12" fill="#cf222e">✘ 需要 uuid→路径索引 + 旧文件回填</text>
  <text x="357" y="252" font-size="12" fill="#cf222e">✘ 离开本工作区无法人工追踪</text>

  <rect x="639" y="95" width="285" height="200" rx="12" fill="#f0f9f1" stroke="#2ea44f" stroke-width="2"/>
  <text x="781" y="125" text-anchor="middle" font-size="15" font-weight="700" fill="#0a6e4f">C. uuid + path 双保险 ✔ 选用</text>
  <text x="659" y="155" font-size="12" fill="#24292f">✔ uuid 主解析：任何移动都免疫</text>
  <text x="659" y="178" font-size="12" fill="#24292f">✔ path 兜底：可读、可人工排查</text>
  <text x="659" y="206" font-size="12" fill="#24292f">✔ 旧文件打开时自动回填 uuid</text>
  <text x="659" y="229" font-size="12" fill="#24292f">✔ 旧格式链接保留重写机制过渡</text>
  <text x="659" y="252" font-size="12" fill="#24292f">✔ 代价：链接字符串稍长</text>

  <!-- 解析流程 -->
  <text x="480" y="330" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1f36">点击链接时的解析顺序</text>
  <rect x="120" y="355" width="180" height="60" rx="10" fill="#eef2ff" stroke="#4c6ef5"/>
  <text x="210" y="390" text-anchor="middle" font-size="13" font-weight="600">用户点击 cmind:// 链接</text>
  <line x1="300" y1="385" x2="345" y2="385" stroke="#555" stroke-width="1.5" marker-end="url(#arr3)"/>
  <rect x="350" y="355" width="200" height="60" rx="10" fill="#fff" stroke="#d0d7de"/>
  <text x="450" y="381" text-anchor="middle" font-size="13" font-weight="600">有 uuid？</text>
  <text x="450" y="401" text-anchor="middle" font-size="11" fill="#6b7280">懒构建 uuid→路径索引</text>
  <line x1="550" y1="370" x2="605" y2="355" stroke="#0a6e4f" stroke-width="1.5" marker-end="url(#arr3)"/>
  <text x="575" y="345" font-size="11" fill="#0a6e4f">找到</text>
  <rect x="610" y="330" width="180" height="50" rx="10" fill="#f0f9f1" stroke="#2ea44f"/>
  <text x="700" y="360" text-anchor="middle" font-size="13" fill="#0a6e4f" font-weight="600">直接打开 ✔（移动免疫）</text>
  <line x1="550" y1="400" x2="605" y2="425" stroke="#cf222e" stroke-width="1.5" marker-end="url(#arr3)"/>
  <text x="578" y="428" font-size="11" fill="#cf222e">uuid 失效</text>
  <line x1="450" y1="415" x2="450" y2="450" stroke="#555" stroke-width="1.5" marker-end="url(#arr3)"/>
  <rect x="350" y="455" width="200" height="55" rx="10" fill="#fff" stroke="#d0d7de"/>
  <text x="450" y="480" text-anchor="middle" font-size="13" font-weight="600">按 path 兜底</text>
  <text x="450" y="500" text-anchor="middle" font-size="11" fill="#6b7280">老链接 / 跨工作区仍可用</text>
  <line x1="550" y1="482" x2="605" y2="482" stroke="#555" stroke-width="1.5" marker-end="url(#arr3)"/>
  <rect x="610" y="457" width="180" height="50" rx="10" fill="#fff1f0" stroke="#f0a8a2"/>
  <text x="700" y="487" text-anchor="middle" font-size="13" fill="#cf222e" font-weight="600">明确提示：目标不存在</text>

  <!-- 兜底保障 -->
  <rect x="60" y="535" width="840" height="60" rx="10" fill="#fff8e6" stroke="#e3c26b"/>
  <text x="480" y="560" text-anchor="middle" font-size="13" fill="#4d3a00">双保险互为补充：应用内移动会重写旧格式 path 链接；Finder 移动由 uuid 兜底；旧 .cmind 文件打开时自动回填 uuid，无需用户迁移</text>
  <text x="480" y="580" text-anchor="middle" font-size="12" fill="#7a5b00">取舍：复制文件会产生相同 uuid（解析取首个匹配），可在"导入工作区"时重新生成</text>
</svg>
