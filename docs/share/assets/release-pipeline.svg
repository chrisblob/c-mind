<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="-apple-system, PingFang SC, sans-serif">
  <defs>
    <marker id="arr4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#555"/></marker>
  </defs>
  <rect width="960" height="430" fill="#fafbfc"/>
  <text x="480" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1f36">一版的完整闭环：改 → 验 → 打 → 发 → 验</text>

  <rect x="35" y="80" width="160" height="80" rx="10" fill="#eef2ff" stroke="#4c6ef5"/>
  <text x="115" y="112" text-anchor="middle" font-size="13" font-weight="600">代码修改</text>
  <text x="115" y="132" text-anchor="middle" font-size="11" fill="#4c6ef5">store / main / editor</text>
  <line x1="195" y1="120" x2="235" y2="120" stroke="#555" stroke-width="1.5" marker-end="url(#arr4)"/>

  <rect x="240" y="80" width="170" height="80" rx="10" fill="#f0f9f1" stroke="#2ea44f"/>
  <text x="325" y="105" text-anchor="middle" font-size="13" font-weight="600">自动化验证</text>
  <text x="325" y="125" text-anchor="middle" font-size="11" fill="#0a6e4f">CMIND_UITEST 场景测试</text>
  <text x="325" y="142" text-anchor="middle" font-size="11" fill="#0a6e4f">真实用户文件做夹具</text>
  <line x1="410" y1="120" x2="450" y2="120" stroke="#555" stroke-width="1.5" marker-end="url(#arr4)"/>

  <rect x="455" y="80" width="160" height="80" rx="10" fill="#fff8e6" stroke="#e3c26b"/>
  <text x="535" y="105" text-anchor="middle" font-size="13" font-weight="600">回归测试</text>
  <text x="535" y="125" text-anchor="middle" font-size="11" fill="#7a5b00">focus + 全功能走查</text>
  <text x="535" y="142" text-anchor="middle" font-size="11" fill="#7a5b00">确保没改坏别的</text>
  <line x1="615" y1="120" x2="655" y2="120" stroke="#555" stroke-width="1.5" marker-end="url(#arr4)"/>

  <rect x="660" y="80" width="140" height="80" rx="10" fill="#ffeef0" stroke="#f0a8a2"/>
  <text x="730" y="105" text-anchor="middle" font-size="13" font-weight="600">本地打包</text>
  <text x="730" y="125" text-anchor="middle" font-size="11" fill="#cf222e">electron-builder</text>
  <text x="730" y="142" text-anchor="middle" font-size="11" fill="#cf222e">dmg + hdiutil 校验</text>
  <line x1="800" y1="120" x2="840" y2="120" stroke="#555" stroke-width="1.5" marker-end="url(#arr4)"/>

  <rect x="845" y="80" width="95" height="80" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="892" y="112" text-anchor="middle" font-size="13" font-weight="600">用户验证</text>
  <text x="892" y="132" text-anchor="middle" font-size="11" fill="#6b7280">真机体验</text>

  <line x1="892" y1="160" x2="892" y2="215" stroke="#555" stroke-width="1.5" marker-end="url(#arr4)"/>
  <text x="905" y="190" font-size="11" fill="#6b7280">验证通过</text>

  <rect x="700" y="220" width="240" height="70" rx="10" fill="#24292f"/>
  <text x="820" y="250" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">git tag v1.0.1 → push</text>
  <text x="820" y="272" text-anchor="middle" font-size="11" fill="#9ea7b3">tag 触发 CI，而非手动发</text>
  <line x1="700" y1="255" x2="660" y2="255" stroke="#555" stroke-width="1.5" marker-end="url(#arr4)"/>

  <rect x="430" y="220" width="240" height="70" rx="10" fill="#eef2ff" stroke="#4c6ef5"/>
  <text x="550" y="250" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1f36">GitHub Actions 双路构建</text>
  <text x="550" y="272" text-anchor="middle" font-size="11" fill="#4c6ef5">mac dmg + win setup.exe + zip</text>
  <line x1="430" y1="255" x2="390" y2="255" stroke="#555" stroke-width="1.5" marker-end="url(#arr4)"/>

  <rect x="160" y="220" width="200" height="70" rx="10" fill="#f0f9f1" stroke="#2ea44f"/>
  <text x="260" y="250" text-anchor="middle" font-size="13" font-weight="600" fill="#0a6e4f">GitHub Release</text>
  <text x="260" y="272" text-anchor="middle" font-size="11" fill="#0a6e4f">3 个产物 + sha256</text>

  <line x1="260" y1="290" x2="260" y2="330" stroke="#555" stroke-width="1.5" marker-end="url(#arr4)"/>

  <rect x="110" y="335" width="740" height="60" rx="10" fill="#fff" stroke="#d0d7de"/>
  <text x="480" y="360" text-anchor="middle" font-size="13" font-weight="600">发版后再验一遍：下载线上 dmg → sha256 对比 → hdiutil verify → 确认产物完整</text>
  <text x="480" y="382" text-anchor="middle" font-size="11" fill="#6b7280">"发布成功"的定义 = 用户拿到的文件完整可用，而不是 CI 转绿</text>
</svg>
